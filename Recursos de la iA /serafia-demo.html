conoces y valoras lo bueno que alguien hace por ti. Te sientes agradecido cuando alguien te ayuda, te apoya o te da algo especial.`},{nombre:`Triste`,glifo:`😞`,ruta:`negativa`,desc:`Es una emoción natural que aparece cuando algo nos duele internamente, nos decepciona o perdemos algo importante. Puede sentirse como un vacío, ganas de llorar, estar en silencio o no tener energía.`},{nombre:`Molesto(a)`,glifo:`😤`,ruta:`negativa`,desc:`Es la sensación de incomodidad o irritación frente a algo que te desagrada o te incomoda. Por ejemplo, cuando alguien te interrumpe o hace algo que no te gusta.`},{nombre:`Culpable`,glifo:`😥`,ruta:`negativa`,desc:`Es sentir que has hecho algo incorrecto o que le has fallado a alguien, lo cual te deja con remordimientos y una sensación de responsabilidad por las consecuencias.`},{nombre:`Avergonzado(a)`,glifo:`😳`,ruta:`negativa`,desc:`Es la sensación de incomodidad y deshonra que aparece cuando crees que hiciste algo mal o cuando te sientes juzgado por los demás.`},{nombre:`Ansioso(a)`,glifo:`😱`,ruta:`negativa`,desc:`Es sentir inquietud y preocupación por lo que puede pasar, como cuando tienes que hablar en público o enfrentarte a una situación nueva.`},{nombre:`Temeroso(a)`,glifo:`😧`,ruta:`negativa`,desc:`Surge como una respuesta a una amenaza inmediata. Es sentir inseguridad ante la posibilidad de que ocurra algo malo o peligroso. Es un estado de preocupación por situaciones o escenarios específicos que anticipas como negativos, lo cual te hace evitar o tener dudas al enfrentarlos.`}],tips_positivos:[`Realiza Actividades que Disfrutes: Dedica tiempo a hobbies y actividades que te hagan sentir bien, como leer, escuchar música, pintar o cualquier otra cosa que disfrutes.`,`Establece Metas Alcanzables: Fijar metas pequeñas y alcanzables puede darte una sensación de logro y mantener tu motivación y determinación.`,`Mantén una Rutina Saludable: Asegúrate de dormir lo suficiente, comer de manera saludable y hacer ejercicio regularmente. Una buena salud física puede mejorar significativamente tu bienestar emocional.`,`Conéctate con Otros: Pasar tiempo con amigos y seres queridos, ya sea en persona o virtualmente, puede proporcionarte apoyo emocional y aumentar tu sentido de pertenencia.`,`Sé amable contigo mismo: Reconoce tus logros y no te castigues por los errores. Todos cometemos errores, y es importante aprender de ellos y seguir adelante.`,`Buscar Propósito y Significado: Reflexiona sobre tu propósito y lo que da sentido a tu vida. Identificar y seguir tu propósito puede proporcionarte una dirección y un profundo sentido de satisfacción.`,`Practica la Gratitud: Dedica unos minutos cada día para reflexionar sobre las cosas por las que estás agradecido. Esto puede ayudarle a mantener una perspectiva positiva.`,`Practica la atención plena y la meditación: Puede ayudarte a mantenerte centrado y reducir el estrés. Hay muchas aplicaciones y recursos en línea que pueden guiarte.`,`Haz Actividades de Servicio: Ayudar a los demás puede aumentar tu propia felicidad. Considera hacer voluntariado o simplemente ayudar a alguien en tu entorno.`,`Oración o Reflexión: Si eres religioso, puedes encontrar orientación y gozo a través de la oración. Si no lo eres, la reflexión diaria sobre tus valores y propósito puede ser igualmente beneficiosa.`,`Conexión con la Naturaleza: Pasa tiempo al aire libre. Muchas personas encuentran una profunda conexión emocional al estar en contacto con el mundo natural, lo que puede ser muy revitalizante.`,`Participar en una Comunidad: Unirte a un grupo o comunidad que comparta tus creencias y valores puede proporcionarte apoyo, inspiración y un sentido de pertenencia.`,`Mantén un Diario: Escribir sobre tus pensamientos y sentimientos puede ayudarte a procesar tus emociones y mantener una actitud positiva.`,`Celebra los Pequeños Logros del Día: Reconoce pequeños éxitos cotidianos, como haber terminado una tarea o haber aprendido algo nuevo. Esta práctica refuerza emociones como orgullo, entusiasmo y satisfacción.`,`Incorpora Micromomentos de Alegría: Integra pequeños estímulos positivos en tu día: una canción que te anime, una taza de tu bebida favorita, un descanso breve al sol. Estos 'microboosts son poderosos generadores de afecto positivo.`,`Practica el Optimismo Entrenado: Haz un ejercicio diario de reinterpretar situaciones difíciles buscando un aspecto esperanzador o de aprendizaje. Esto fortalece emociones como la esperanza y la determinación.`,`Cultiva la Curiosidad Activa: Realiza actividades que despierten tu interés: explorar un tema nuevo, hacer preguntas, probar un sabor o ruta distinta. La curiosidad estimula emociones como el entusiasmo y la inspiración.`,`Usa Afirmaciones Positivas Realistas: Repite frases enfocadas en tus capacidades reales (por ejemplo: “Tengo recursos para resolver esto”). Las afirmaciones ayudan a reforzar autoconfianza y energía emocional.`,`Visualiza Escenarios Positivos: Dedica 3–5 minutos al día a imaginar metas cumplidas o días que salgan bien. La visualización aumenta emociones positivas anticipatorias como esperanza y motivación.`,`Reserva Espacios para el Juego: Incorpora actividades lúdicas (juegos de mesa, dinámicas divertidas, retos creativos). El juego activa alegría, energía y conexión social.`,`Practica la 'Pausa de Apreciación': Detente en momentos cotidianos para notar algo agradable: una sensación, un olor, una frase, un paisaje. Aumenta la capacidad de experimentar disfrute y calma positiva.`,`Rodéate de Estímulos Positivos: Ambientar tus espacios con música, luz natural, aromas o colores que te agraden favorece emociones como tranquilidad, inspiración y bienestar general.`,`Revisa tus Fortalezas Personales: Identifica tus puntos fuertes (creatividad, disciplina, empatía, humor…) y busca usarlos intencionalmente cada día. Aplicar fortalezas genera sentido de eficacia y satisfacción.`,`Programa 'Momentos de Inspiración': Lee frases motivadoras, mira videos inspiradores o contenido que despierte admiración. La inspiración es un componente clave del afecto positivo.`,`Dedica Tiempo a Aprender Algo Nuevo: Aprender activa emociones positivas como entusiasmo, interés y sensación de crecimiento personal.`,`Practica la Risa Intencional: Ver comedia, recordar anécdotas graciosas o practicar ejercicios de risoterapia aumenta el afecto positivo de forma inmediata.`,`Construye Rituales Positivos: Crea rutinas simbólicas que te conecten con bienestar: un ritual matutino, una pausa consciente después del trabajo, o una pequeña celebración semanal.`,`Mantén un 'Tablero de Visión': Coloca imágenes, frases o metas que te inspiren. Verlo a diario genera emociones positivas como esperanza, energía y motivación.`],recs_negativas:{Triste:[`Participa en juegos de mesa estratégicos o grupos recreativos para fomentar emociones opuestas.`,`Únete a una actividad de peer coaching o mentoría para recibir apoyo.`,`Practica mindfulness para observar tus emociones sin juzgarlas.`,`Recuerda momentos donde te sentiste seguro antes de una situación desafiante.`],"Molesto(a)":[`Realiza una sesión corta de “power poses” durante un par de minutos para ganar confianza.`,`Tómate unos minutos de descanso si sientes que algo o alguien te molesta, sal de la situación para recuperar la calma.`,`Practica la respiración profunda durante unos minutos, enfocándote en tu respiración para reducir la irritación.`],Culpable:[`Contribuir a una causa puede ayudarte a reducir los sentimientos de culpa. Participa en una actividad de voluntariado.`,`Graba un audio reflexivo sobre cómo te sientes y lo que puedes hacer para mejorar.`,`Escucha tu propio audio reflexivo después de grabarlo para ganar perspectiva.`],"Avergonzado(a)":[`Asiste a talleres de “Storytelling” o graba anécdotas con tu móvil.`,`Participa en actividades de roles para ganar confianza social.`,`Crea una lista de situaciones que generan ansiedad e interactúa con ellas gradualmente.`],"Ansioso(a)":[`Haz un ejercicio de grounding: usa una pelot
